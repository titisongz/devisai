<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe — DevisAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0d0d2b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo span {
      font-size: 1.8rem;
      font-weight: 700;
      color: #2ecc71;
    }
    .card {
      background: #1a1a4e;
      border-radius: 16px;
      padding: 2rem;
      border: 1px solid rgba(255,255,255,0.08);
    }
    h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
      position: relative;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.7);
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 0.75rem 2.8rem 0.75rem 1rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      caret-color: #ffffff;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #2ecc71;
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 30px #1a1f2e inset !important;
      -webkit-text-fill-color: #ffffff !important;
    }
    .toggle-password {
      position: absolute;
      right: 0.9rem;
      top: 2.1rem;
      cursor: pointer;
      color: rgba(255,255,255,0.4);
      font-size: 1rem;
      background: none;
      border: none;
      padding: 0;
    }
    .toggle-password:hover { color: #ffffff; }
    .btn {
      width: 100%;
      padding: 0.85rem;
      background: #2ecc71;
      color: #0d0d2b;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 0.5rem;
    }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .message {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 1rem;
      display: none;
    }
    .message.error { background: rgba(231,76,60,0.15); color: #e74c3c; border: 1px solid rgba(231,76,60,0.3); }
    .message.success { background: rgba(46,204,113,0.15); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
    .back-link {
      text-align: center;
      margin-top: 1.2rem;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.5);
    }
    .back-link a { color: #2ecc71; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo"><span>DevisAI</span></div>
    <div class="card">
      <h2>Nouveau mot de passe</h2>
      <p class="subtitle">Choisissez un mot de passe sécurisé pour votre compte.</p>

      <div class="message error" id="msgError"></div>
      <div class="message success" id="msgSuccess"></div>

      <div class="form-group">
        <label>Nouveau mot de passe</label>
        <input type="password" id="password" placeholder="8 caractères minimum" autocomplete="new-password">
        <button class="toggle-password" onclick="togglePwd('password', this)">👁</button>
      </div>
      <div class="form-group">
        <label>Confirmer le mot de passe</label>
        <input type="password" id="passwordConfirm" placeholder="Répétez le mot de passe" autocomplete="new-password">
        <button class="toggle-password" onclick="togglePwd('passwordConfirm', this)">👁</button>
      </div>

      <button class="btn" id="btnSave" onclick="savePassword()">Enregistrer le mot de passe</button>

      <div class="back-link">
        <a href="login.html">← Retour à la connexion</a>
      </div>
    </div>
  </div>

  <script>
    function togglePwd(id, btn) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }

    function showMsg(type, text) {
      const el = document.getElementById(type === 'error' ? 'msgError' : 'msgSuccess');
      const other = document.getElementById(type === 'error' ? 'msgSuccess' : 'msgError');
      other.style.display = 'none';
      el.textContent = text;
      el.style.display = 'block';
    }

    async function savePassword() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('passwordConfirm').value;
      const btn = document.getElementById('btnSave');

      if (password.length < 8) return showMsg('error', 'Le mot de passe doit faire au moins 8 caractères.');
      if (password !== confirm) return showMsg('error', 'Les mots de passe ne correspondent pas.');

      btn.disabled = true;
      btn.textContent = 'Enregistrement...';

      const client = getSupabaseClient();
      const { error } = await client.auth.updateUser({ password });

      if (error) {
        showMsg('error', 'Erreur : ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Enregistrer le mot de passe';
      } else {
        showMsg('success', 'Mot de passe mis à jour ! Redirection...');
        setTimeout(() => window.location.href = 'login.html', 2000);
      }
    }

    // Récupérer le token depuis l'URL au chargement
    window.addEventListener('load', async () => {
      const hash = window.location.hash;
      const params = new URLSearchParams(hash.replace('#', '?'));
      const accessToken = params.get('access_token');
      const type = params.get('type');

      if (type === 'recovery' && accessToken) {
        const client = getSupabaseClient();
        await client.auth.setSession({
          access_token: accessToken,
          refresh_token: params.get('refresh_token') || ''
        });
      } else {
        // Pas de token valide
        showMsg('error', 'Lien invalide ou expiré. Veuillez refaire une demande de réinitialisation.');
        document.getElementById('btnSave').disabled = true;
      }
    });
  </script>
</body>
</html>
